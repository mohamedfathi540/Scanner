services:
  # PostgreSQL (PGvector) — infrastructure only for dev
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: daftar_pgvector
    ports:
      - "5536:5432"
    volumes:
      - pgvector_dev_data:/var/lib/postgresql/data
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ulimits:
      core: 0
    deploy:
      resources:
        limits:
          cpus: '0.5'    # Max half a CPU core
          memory: 512M   # Max 512MB RAM


  # Nginx reverse proxy for hybrid dev (routes to local backend/frontend)
  daftar_nginx_dev:
    image: nginx:latest
    container_name: daftar_nginx_dev
    ports:
      - "8999:80"
    volumes:
      - ./Nginx/Default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    restart: unless-stopped
    ulimits:
      core: 0
    deploy:
      resources:
        limits:
          cpus: '0.5'    # Max half a CPU core
          memory: 512M   # Max 512MB RAM

  backend_dev:
    build:
      context: ..
      dockerfile: Docker/minirag/Dockerfile
    container_name: daftar_backend_dev
    ports:
      - "8102:8101" # Changed to 8102 to avoid conflicts with your current setup
    volumes:
      - ../SRC:/app # Mount local code for hot reloading
      - /srv/mergerfs/2TB/daftar_hf_cache:/app/cache # Same as production for HF cache
    env_file:
      - ../SRC/.env
    environment:
      - POSTGRES_HOST=pgvector
      - POSTGRES_PORT=5432
      - HF_HOME=/app/cache
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  pgvector_dev_data:
    driver: local

